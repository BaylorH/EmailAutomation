[pytest]
# Collect ONLY test_*.py — deliberately NOT pytest's default, which also collects
# *_test.py.
#
# tests/ contains a dozen legacy standalone harnesses (integration_test.py,
# e2e_test.py, production_test.py, campaign_lifecycle_test.py,
# full_pipeline_test.py, standalone_test.py, e2e_test_suite.py, and the
# non-matching batch_runner.py / quality_benchmark.py / persona_campaign_tester.py
# they import). Each does this at MODULE IMPORT time, not inside a fixture:
#
#     sys.modules['google.cloud'] = MagicMock()
#
# pytest imports every collected module during collection, before running a single
# test. So one of these harnesses being *collected* permanently replaces the
# google.cloud namespace package for the whole session, and every module imported
# afterwards that does `from google.cloud.firestore_v1 import FieldFilter` dies
# with "No module named 'google.cloud.firestore_v1'; 'google.cloud' is not a
# package".
#
# The damage this was doing, measured on an untouched tree:
#
#     collecting *_test.py too :  252 failed, 1258 passed, 132 errors
#     test_*.py only           :    4 failed, 3549 passed
#
# Roughly 2300 tests were never executing, and ~147 of the "failures" were this
# one poisoning rather than anything wrong with the product. Worse, it is
# order-dependent: which tests die depends on when a harness happens to be
# collected, so a green run and a red run could mean the same thing. A suite that
# reports confidently while measuring a third of itself is the most expensive kind
# of broken instrument, because it is trusted.
#
# Nothing is lost by this. Those harnesses already fail collection today, so they
# contribute zero passing tests, and an explicit path (`pytest tests/e2e_test.py`)
# still collects them for anyone who wants to run one by hand.
#
# The real repair is for those files to stop mutating sys.modules at import time
# (do it in a fixture, or move them out of tests/). Until then this stops them
# from silently deleting the rest of the suite.
python_files = test_*.py
