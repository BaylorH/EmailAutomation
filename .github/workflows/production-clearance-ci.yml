name: Production Clearance CI

on:
  push:
    branches:
      - codex/sitesift-production-clearance-**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-clearance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:9
      GOOGLE_CLOUD_PROJECT: sitesift-offline-ci
      OPENAI_API_KEY: ""
      # Outbound effects stay paused unless one hermetic step explicitly opts in.
      SITESIFT_OUTBOUND_MODE: paused
      SITESIFT_SOURCE_COORDINATOR_MODE: disabled

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Blackhole provider network for tests
        shell: bash
        run: |
          {
            echo 'HTTP_PROXY=http://127.0.0.1:9'
            echo 'HTTPS_PROXY=http://127.0.0.1:9'
            echo 'ALL_PROXY=http://127.0.0.1:9'
            echo 'http_proxy=http://127.0.0.1:9'
            echo 'https_proxy=http://127.0.0.1:9'
            echo 'all_proxy=http://127.0.0.1:9'
            echo 'NO_PROXY=127.0.0.1,localhost'
            echo 'no_proxy=127.0.0.1,localhost'
          } >> "$GITHUB_ENV"

      - name: Run release and identity-isolation gates
        run: >-
          python -m unittest
          auth_service.test_auth_service_isolation
          tests.test_jill_live_campaign_regressions
          tests.test_full_campaign_e2e
          -v

      - name: Run complete B1 focused suite
        run: >-
          python -m unittest
          tests.test_source_coordinator_inventory
          tests.test_source_coordinator
          tests.test_source_coordinator_integration
          tests.test_processing_retryability
          tests.test_event_processing_order
          tests.test_compound_nonviable_processing
          tests.test_operator_message_replay
          tests.test_pending_responses
          tests.test_cleanup_retention
          tests.test_system_health
          -v

      - name: Run complete B2 focused suite
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_row_authority*.py'
          -v

      - name: Run retained M2 changed-surface suite
        # These send expectations require live semantics, but every provider
        # boundary is faked and provider egress remains blackholed.
        env:
          SITESIFT_OUTBOUND_MODE: live
        run: >-
          python -m unittest
          tests.test_action_audit_backend
          tests.test_broker_language_broker_attachment_or_link_only
          tests.test_combo_karsen_launch_placeholder_and_tour_leak
          tests.test_compound_nonviable_processing
          tests.test_go_condition_send_failure_observability
          tests.test_graph_immutable_sent_identity
          tests.test_graph_message_id_path_encoding
          tests.test_graph_subject_binding
          tests.test_operator_message_replay
          tests.test_outbound_kill_switch
          tests.test_pending_completion_health
          tests.test_pending_draft_review_resolution_api
          tests.test_pending_responses
          tests.test_pending_send_reconciliation_api
          tests.test_post_settlement_completion_obligations
          tests.test_processing_completion_guards
          tests.test_processing_reply_indexing
          tests.test_processing_reply_safety
          tests.test_processing_retryability
          tests.test_send_permits
          tests.test_surface_d_6_
          tests.test_system_health
          tests.test_terminal_completion_replay
          -v

      - name: Compile changed Python and check the release diff
        shell: bash
        env:
          # Immutable commit currently deployed by the process-user revision.
          PRODUCTION_BASELINE_SHA: 92de8ab5bf841f5faa453de34cc3846bd65611af
        run: |
          set -euo pipefail
          {
            git diff --name-only --diff-filter=ACMR "$PRODUCTION_BASELINE_SHA" -- '*.py'
            git ls-files --others --exclude-standard -- '*.py'
          } | LC_ALL=C sort -u | xargs python -m py_compile
          git diff --check "$PRODUCTION_BASELINE_SHA"
