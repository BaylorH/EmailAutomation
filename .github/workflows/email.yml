name: Email Automation
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

# Prevent concurrent runs - cancel in-progress if new one starts
concurrency:
  group: email-automation
  cancel-in-progress: true

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Explicit, because the default is "whatever the default branch is" and
          # that is exactly how this job spent five weeks running stale code
          # without anyone being able to see it from a run page.
          ref: main

      - name: Report the revision this run is actually using
        run: |
          SHA="$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --format=%s)"
          COMMITTED="$(git log -1 --format=%cI)"
          AGE_DAYS=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Running $SHA, committed $COMMITTED (${AGE_DAYS} days old)"
          echo "  $SUBJECT"
          {
            echo "### Production revision"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$SHA\` |"
            echo "| committed | $COMMITTED |"
            echo "| age | ${AGE_DAYS} days |"
            echo "| subject | $SUBJECT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AGE_DAYS" -ge 14 ]; then
            echo "::warning title=Stale production code::This run is on code ${AGE_DAYS} days old. Fixes merged after $COMMITTED are NOT live."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Stale:** this run is on code ${AGE_DAYS} days old. Anything merged after $COMMITTED is not live." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CLIENT_ID prefix
        run: |
          if [[ "$CLIENT_ID" != 54cec* ]]; then
            echo "❌ CLIENT_ID does not start with expected prefix"
            exit 1
          else
            echo "✅ CLIENT_ID prefix looks correct"
          fi
        env:
          CLIENT_ID: ${{ secrets.AZURE_API_APP_ID }}

      - name: Write service account key
        # Expect a repo secret named FIREBASE_SERVICE_ACCOUNT_JSON containing the full JSON
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > $RUNNER_TEMP/sa.json
          
      - name: Run email script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_API_APP_ID: ${{ secrets.AZURE_API_APP_ID }}
          AZURE_API_CLIENT_SECRET: ${{ secrets.AZURE_API_CLIENT_SECRET }}
          # Google OAuth (helper Gmail account for Drive/Sheets)
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Emergency launch safety gate: only Baylor's test mailbox is processed.
          # This disables autonomous sends/scans/follow-ups for all live beta users
          # until the full Baylor/BP21 proof is clean again.
          SITESIFT_DEV_SCOPED_SCHEDULER: "1"
          SITESIFT_SCHEDULER_TARGET_USER_IDS: "NO7lVYVp6BaplKYEfMlWCgBnpdh2"
          SITESIFT_SCHEDULER_ALLOWED_USER_IDS: "NO7lVYVp6BaplKYEfMlWCgBnpdh2"
          # Global monthly OpenAI spend cap. Both come from repo VARIABLES (not
          # secrets) so the cap can be raised, lowered or switched off from the
          # repo settings without a code change or a redeploy. Unset resolves to
          # an empty string, which budget_guard reads as enforcement OFF and no
          # limit — so the guard stays inert, and costs zero Firestore reads,
          # until someone deliberately sets ENFORCE_OPENAI_BUDGET=true AND a
          # positive USAGE_MONTHLY_BUDGET_USD. Without this passthrough the guard
          # could never be turned on at all.
          ENFORCE_OPENAI_BUDGET: ${{ vars.ENFORCE_OPENAI_BUDGET }}
          USAGE_MONTHLY_BUDGET_USD: ${{ vars.USAGE_MONTHLY_BUDGET_USD }}
        # run: python noPopup_signin_emails_to_excel.py
        run: python main.py
        # run: python scheduler_runner.py
